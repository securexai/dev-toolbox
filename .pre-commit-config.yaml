# .pre-commit-config.yaml - dev-toolbox's own dogfood gate.
#
# Distinct from templates/.pre-commit-config.yaml (which is dropped INTO
# target repos). This config excludes templates/ from secret scanning because
# the template files intentionally contain example regex patterns that look
# like the secrets they protect against.
#
# Install hooks (once per clone):
#   pre-commit install --install-hooks
# Audit the worktree:
#   pre-commit run --all-files

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        args: [--maxkb=10240]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: no-commit-to-branch
        args:
          - --branch=main
          - --branch=master
          - --branch=develop
          - --pattern=^release/.*

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.1.2
    hooks:
      - id: betterleaks
        # Templates ship example secret patterns and sample tokens that the
        # default rules would flag. Skip the templates/ directory from secret
        # scanning; the template file itself is what is being maintained.
        exclude: '^templates/'

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - '@commitlint/cli@19.5.0'
          - '@commitlint/config-conventional@19.5.0'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        # Templates' own .markdownlint-cli2.yaml is for downstream consumers;
        # the root .markdownlint-cli2.yaml ignores templates/ already, so
        # this hook only sees the dev-toolbox docs themselves.

  # ---------------------------------------------------------------------------
  # Local: parity check between the dogfood gate (this file) and the gate
  # shipped to downstream repos (templates/.pre-commit-config.yaml). Fires
  # whenever either YAML is staged; bails loud if their (repo, rev) pin sets
  # diverge. Local hook = does NOT mirror into templates/, by design.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: precommit-config-parity
        name: Pre-commit config parity (root vs templates)
        entry: scripts/check-precommit-parity.sh
        language: script
        files: '^(\.pre-commit-config\.yaml|templates/\.pre-commit-config\.yaml|scripts/check-precommit-parity\.sh)$'
        pass_filenames: false
