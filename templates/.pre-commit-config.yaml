# .pre-commit-config.yaml - dev-toolbox enforcement baseline
#
# Installed by `bootstrap-repo.sh` from the dev-toolbox container into any
# target git repository. Mirrors the enforcement set documented in
# dev-toolbox/README.md and the global CLAUDE.md.
#
# Install hooks (once per clone):
#   pre-commit install --install-hooks
# Audit the worktree:
#   pre-commit run --all-files
# Bump pinned revisions:
#   pre-commit autoupdate

# Hooks fire at the pre-commit and commit-msg stages. pre-push is not in the
# list because no hook in this file targets that stage; declaring it would
# create a no-op .git/hooks/pre-push. Add `pre-push` back when (and only
# when) a hook with `stages: [pre-push]` lands here.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # ---------------------------------------------------------------------------
  # Baseline hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        args: [--maxkb=10240]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: no-commit-to-branch
        args:
          - --branch=main
          - --branch=master
          - --branch=develop
          - --pattern=^release/.*

  # ---------------------------------------------------------------------------
  # Secret detection - betterleaks (upstream hosted hook).
  # The hook entry is fixed by upstream as
  #   betterleaks git --pre-commit --redact --staged --verbose
  # so do NOT override `args` here. Config lives in .betterleaks.toml.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.1.2
    hooks:
      - id: betterleaks

  # ---------------------------------------------------------------------------
  # Conventional Commits - commitlint (commit-msg stage).
  # Isolated node env via additional_dependencies; no global install required.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - '@commitlint/cli@19.5.0'
          - '@commitlint/config-conventional@19.5.0'

  # ---------------------------------------------------------------------------
  # Shell linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # Default severity is "warning". Drop to --severity=error in repos
        # with legacy code that has not yet been cleaned up.

  # ---------------------------------------------------------------------------
  # Markdown linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  # ---------------------------------------------------------------------------
  # Shell formatting - check only. Reuses the Fedora RPM shfmt baked into the
  # dev-toolbox image so every developer machine and CI run the identical
  # version. `-d` prints a diff and exits non-zero, so files are never
  # rewritten. ShellSpec spec files are excluded.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: shfmt
        name: shfmt (check only)
        entry: shfmt -d -l -i 2 -ci -bn
        language: system
        files: \.sh$
        exclude: ^spec/
